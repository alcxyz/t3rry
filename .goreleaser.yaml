version: 2

project_name: t3rry

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/t3rry
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: t3rry
    name_template: "t3rry_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "t3rry_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: alcxyz
    name: t3rry
  draft: false
  prerelease: auto

homebrew_casks:
  - name: t3rry
    repository:
      owner: alcxyz
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/alcxyz/t3rry
    description: Move T3 Code projects and threads between server instances
    license: MIT
    hooks:
      post:
        # The binaries are not signed or notarized.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/t3rry"]
          end

aurs:
  - name: t3rry-bin
    homepage: https://github.com/alcxyz/t3rry
    description: Move T3 Code projects and threads between server instances
    maintainers:
      - alcxyz <alcxyz@users.noreply.github.com>
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    # Only trust the pinned AUR host keys the release job writes to known_hosts.
    git_ssh_command: "ssh -i {{ .KeyPath }} -o StrictHostKeyChecking=yes -F /dev/null"
    git_url: ssh://aur@aur.archlinux.org/t3rry-bin.git
    provides:
      - t3rry
    conflicts:
      - t3rry
    package: |-
      install -Dm755 "./t3rry" "${pkgdir}/usr/bin/t3rry"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/${pkgname}/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/t3rry/README.md"
